name: Android APK Build

on:
  push:
    branches: [develop]
    paths:
      - 'mobile-app-v2/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Android APK (EC2 backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app-v2/package-lock.json

      # ── 3. Java (required by Gradle) ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Restore Gradle cache ──────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ hashFiles('mobile-app-v2/android/**/*.gradle*', 'mobile-app-v2/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-v2-

      # ── 6. Install JS dependencies ───────────────────────────────────────────
      - name: Install dependencies
        working-directory: mobile-app-v2
        run: npm ci

      # ── 7. Write .env pointing to EC2 backend ────────────────────────────────
      - name: Set EC2 API URL
        working-directory: mobile-app-v2
        run: echo "EXPO_PUBLIC_API_URL=https://htm.catalystservices.eco" > .env

      # ── 8. Generate native Android project via Expo Prebuild ─────────────────
      - name: Expo Prebuild (generate Android project)
        working-directory: mobile-app-v2
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_API_URL: https://htm.catalystservices.eco

      # ── 9. Build Debug APK (no signing needed) ────────────────────────────────
      - name: Build APK
        working-directory: mobile-app-v2/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 || ./gradlew assembleDebug --no-daemon

      # ── 10. Rename APK with date ──────────────────────────────────────────────
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          APK_SRC=$(find mobile-app-v2/android/app/build/outputs/apk -name "*.apk" | head -1)
          mkdir -p artifacts
          cp "$APK_SRC" "artifacts/FMApp-EC2-${DATE}.apk"
          echo "APK_NAME=FMApp-EC2-${DATE}.apk" >> $GITHUB_ENV

      # ── 11. Upload APK as downloadable artifact (kept 30 days) ───────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMApp-APK-${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 30
